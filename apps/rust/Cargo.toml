[package]
name = "mahjong-rust-app"
version = "1.0.0"
edition = "2021"

[dependencies]
mahjong-core = { path = "../../crates/mahjong-core" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCollection", "NodeList", "Node", "Performance", "console"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
