name: Deploy both apps to GitHub Pages

# TS app  -> /
# Rust app -> /rust/
# Both previews are independent static sites sharing one Pages domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate + verify shared data (determinism gate)
        run: cargo run --release -p mahjong-core --bin gen-campaign -- --check
      - name: Build wasm core
        run: wasm-pack build crates/mahjong-wasm --target web --out-dir ../../apps/ts/wasm-core --release
      - name: Build TS app
        working-directory: apps/ts
        run: |
          npm ci
          npm run check
          npm run build -- --base /mahjong/
      - uses: actions/upload-artifact@v4
        with:
          name: ts-dist
          path: apps/ts/dist

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build Rust app with /mahjong/rust/ base
        working-directory: apps/rust
        env:
          TRUNK_PUBLIC_PATH: /mahjong/rust/
        run: |
          trunk build --release --public-url /mahjong/rust/
          cp dist/index.html dist/404.html 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-dist
          path: apps/rust/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build-ts, build-rust]
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          merge-multiple: false
          path: artifacts
      - name: Layout
        run: |
          mkdir -p site/rust
          cp -r artifacts/ts-dist/* site/
          cp -r artifacts/rust-dist/* site/rust/
          # fix asset paths inside rust index for its subdirectory
          sed -i 's|="/|="/mahjong/rust/|g; s|url(/|url(/mahjong/rust/|g' site/rust/index.html || true
      - uses: actions/configure-pages@v5
      - id: page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
