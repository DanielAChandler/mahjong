[package]
name = "mahjong-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
mahjong-core = { path = "../mahjong-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
